name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: [Mupdate.lua, Updater.lua]

jobs:
  Release:
    # Closing a PR without merging it also fires this event.
    if: github.event.pull_request.merged == true && github.repository_owner == 'gesslar'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The commit the merge put on main, rather than the PR's merge ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set release tag
        id: tag
        run: echo "date=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          artifacts: "LICENSE.txt,Mupdate.lua,Updater.lua"
          bodyFile: README.md
          commit: ${{ github.event.pull_request.merge_commit_sha }}
          tag: ${{ steps.tag.outputs.date }}
          name: Release ${{ steps.tag.outputs.date }}
